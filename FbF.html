<input type="hidden" class="sheet-tabstoggle" name="attr_sheetTab"  value="display"  />
<div>
    <button type="action" name="act_input">Input</button>
    <button type="action" name="act_display">Display</button>
</div>

<div class="sheet-input">
    <div class="2colrow">
        <div class="col">
            <h3>Team Information</h3>
            <label>Name:</label><input type="text" name="attr_character_name">
            <br>
            <label for="attr_type">Type:</label>
            <select name="attr_type">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="Infantry Squad">Infantry Squad</option>
                <option value="Infantry Team">Infantry Team</option>
                <option value="Individual">Individual</option>
                <option value="Crewed Weapon">Crewed Weapon</option>
                <option value="Vehicle">Vehicle</option>
                <option value="Soft Vehicle">Soft Vehicle</option>
                <option value="System Unit">System Unit</option>
            </select>
            <br>            
            <label for="attr_nation">Nation:</label>
            <select name="attr_nation">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="USA">USA</option>
                <option value="Germany">Germany</option>
                <option value="Soviet">Soviet Union</option>
                <option value="UK">United Kingdom</option>
                <option value="Neutral">Neutral</option>
            </select>
           <label for="attr_individual">Individual Type:</label>
            <select name="attr_individual">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="Leader">Leader</option>
                <option value="Forward Observer">Forward Observer</option>
                <option value="Sniper">Sniper</option>
            </select>
            <label>Recon Unit:</label><input type="checkbox" name="attr_recon" value="1">
        </div>
        <div class="col">
            <h3>Attributes</h3>
            <label>Morale:</label><input type="number" name="attr_morale">
            <label>Movement:</label><input type="number" name="attr_move">
            <label>Move or Fire:</label><input type="checkbox" name="attr_movefire" value="1">
                    <label>Move or Fire:</label><input type="checkbox" name="attr_movefire" value="1">

            <h3>Vehicle Info</h3>
            <label>Leader?:</label><input type="checkbox" name="attr_armourLeader" value="1">
            <label>Front Armour:</label><input type="text" name="attr_armourF">
            <label>Side/Rear Armour:</label><input type="text" name="attr_armourS">
            <label for="attr_turret">Turret:</label>
            <select name="attr_turret">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="Superior">Superior</option>
                <option value="Inferior">Inferior</option>
                <option value="Fixed">Fixed</option>
            </select>


        </div>
    </div>    

    <div class="row">
        <h3>Weapons</h3>

        <div class="weapons">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Eff. Range</th>
                        <th>Range Dice</th>
                        <th>Penetration</th>
                        <th>White Dice</th>
                        <th>Red Dice</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="text" name="attr_weapon1name"></td>
                        <td><input type="text" name="attr_weapon1eff"></td>
                        <td><input type="text" name="attr_weapon1rangedice"></td>
                        <td><input type="text" name="attr_weapon1pen"></td>
                        <td><input type="text" name="attr_weapon1white"></td>
                        <td><input type="text" name="attr_weapon1red"></td>
                        <td><input type="text" name="attr_weapon1notes"></td>
                    </tr>
                    <tr>
                        <td><input type="text" name="attr_weapon2name"></td>
                        <td><input type="text" name="attr_weapon2eff"></td>
                        <td><input type="text" name="attr_weapon2rangedice"></td>
                        <td><input type="text" name="attr_weapon2pen"></td>
                        <td><input type="text" name="attr_weapon2white"></td>
                        <td><input type="text" name="attr_weapon2red"></td>
                        <td><input type="text" name="attr_weapon2notes"></td>
                    </tr>
                </tbody>
            </table>    
        </div>   
    </div>
</div>


<div class="sheet-display">
    <input type="hidden" name="attr_nation"/>
    <div class="mysheet">
        <div class="attributes">
            <main>
                <section class="header f-center">
                    <h1><span name="attr_name1"></span></h1>
                    <h2><span name="attr_name2"></span></h2>
                    <h2><span name="attr_line2"></span></h2>
                    <hr>
                    <h3>Morale: <span name="attr_morale"></span>+</h3>
                    <h3>Speed: <span name="attr_move"></span> Hexes</h3>
                    <h3><span name="attr_moveinfo"></span></h3>
                </section>

                <section class="special f-center">
                    
                </section>

                <section class="common">
                    <div>
                        <img alt="Character Avatar" name="attr_character_avatar" style="width:auto;height:250px; bottom: 0;"/>
                    </div>
                </section>

                <section class="weapon">    
                    <div class="weaponinfo">
                        <span>Name</span>    
                        <span>Eff.Range</span>    
                        <span>Range Dice</span>    
                        <span>Penetration</span>    
                        <span>White Dice</span>    
                        <span>Red Dice</span>    
                        <span>Notes</span>
                    </div>               
                    <div class="weapons">
                        <h4><span name="attr_weapon1name"></span></h4>
                        <h4><span name="attr_weapon1eff"></span></h4>
                        <h4><span name="attr_weapon1rangedice"></span></h4>
                        <h4><span name="attr_weapon1pen"></span></h4>
                        <h4><span name="attr_weapon1white"></span></h4>
                        <h4><span name="attr_weapon1red"></span></h4>
                        <h4><span name="attr_weapon1notes"></span></h4>
                        <h4><span name="attr_weapon2name"></span></h4>
                        <h4><span name="attr_weapon2eff"></span></h4>
                        <h4><span name="attr_weapon2rangedice"></span></h4>
                        <h4><span name="attr_weapon2pen"></span></h4>
                        <h4><span name="attr_weapon2white"></span></h4>
                        <h4><span name="attr_weapon2red"></span></h4>
                        <h4><span name="attr_weapon2notes"></span></h4>
                    </div>
                </section>
            </main>
        </div>
    </div>    
</div>








<script type="text/worker">
    const buttonlist = ["input","display"];
    buttonlist.forEach(button => {
        on(`clicked:${button}`, function() {
            setAttrs({
                sheetTab: button
            });
        });
    });

    on("sheet:opened", function() {
        setAttrs({sheetTab:"display"});
    });


    on("change:armour change:type change:speed sheet:opened", function() {
        getAttrs(["type","movefire","individual","nation","character_name","recon"], function(values) {
            let type = values.type;
            let line2 = type;
            if (type === "Individual") {
                line2 = values.individual;
            }

            let name = values.character_name || '';
            name = name.split(",");
            let name1 = name[0].trim();
            let name2 = name[1].trim();
            
            let moveinfo = "";
            if (values.movefire === "1") {
                moveinfo = "Move OR Fire";
            }
            if (values.recon === "1") {
                moveinfo = "Recon Unit";
            }




            setAttrs({
                "moveinfo": moveinfo,
                "line2": line2,
                "name1": name1,
                "name2": name2,
            }); 
        });
    });
</script>
